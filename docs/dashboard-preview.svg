    <text x="550" y="541" fill="#111827" font-weight="700">Spotify</text><text x="1020" y="541" fill="#111827" font-weight="700">৳ 250</text>
    <text x="550" y="569" fill="#6b7280">Streaming · 30 October</text>
  </g>
  <path d="M535 503h588" stroke="#e5e7eb"/>
  <text x="76" y="673" fill="#111827" font-family="Arial,sans-serif" font-size="20" font-weight="700">All Subscriptions</text>
  <text x="849" y="673" fill="#6b7280" font-family="Arial,sans-serif" font-size="15">Manage your records below</text>
