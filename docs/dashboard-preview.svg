  <text x="875" y="45" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">Dashboard</text>
  <text x="1002" y="45" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">Logout</text>
  <text x="48" y="132" fill="#111827" font-family="Arial,sans-serif" font-size="31" font-weight="700">Hello, User!</text>
  <text x="48" y="162" fill="#6b7280" font-family="Arial,sans-serif" font-size="16">Here's what's happening with your subscriptions.</text>
  <rect x="941" y="111" width="211" height="48" rx="24" fill="#6366f1"/>
