    <rect x="411" y="195" width="345" height="148" rx="22"/>
    <rect x="774" y="195" width="378" height="148" rx="22"/>
    <rect x="48" y="361" width="440" height="251" rx="22"/>
    <rect x="506" y="361" width="646" height="251" rx="22"/>
    <rect x="48" y="630" width="1104" height="72" rx="22"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#6b7280" font-size="15" font-weight="700">
    <text x="76" y="245">MONTHLY SPEND</text><text x="439" y="245">ACTIVE ITEMS</text><text x="802" y="245">PREMIUM PICK</text>
  </g>
  <g font-family="Arial,sans-serif" fill="#111827" font-size="36" font-weight="700">
    <text x="76" y="302">৳ 1,449.00</text><text x="439" y="302">3</text><text x="802" y="302">Netflix</text>
  </g>
  <text x="76" y="401" fill="#111827" font-family="Arial,sans-serif" font-size="20" font-weight="700">Spendings Distribution</text>
  <circle cx="239" cy="500" r="77" fill="none" stroke="#e5e7eb" stroke-width="30"/>
  <circle cx="239" cy="500" r="77" fill="none" stroke="#6366f1" stroke-width="30" stroke-dasharray="240 484" transform="rotate(-90 239 500)"/>
  <circle cx="239" cy="500" r="77" fill="none" stroke="#10b981" stroke-width="30" stroke-dasharray="130 484" stroke-dashoffset="-240" transform="rotate(-90 239 500)"/>
  <circle cx="239" cy="500" r="77" fill="none" stroke="#f59e0b" stroke-width="30" stroke-dasharray="94 484" stroke-dashoffset="-370" transform="rotate(-90 239 500)"/>
  <text x="534" y="401" fill="#111827" font-family="Arial,sans-serif" font-size="20" font-weight="700">Upcoming Bills</text>
