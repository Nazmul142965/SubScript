<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SubScript dashboard preview</title>
  <desc id="desc">Illustration of the subscription dashboard with spending cards, a category chart, upcoming bills, and a subscription table.</desc>
  <rect width="1200" height="720" fill="#f3f4f6"/>
  <rect width="1200" height="74" fill="#fff"/>
  <path d="M0 73h1200" stroke="#e5e7eb"/>
