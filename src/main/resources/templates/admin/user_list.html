<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>SubScript Pro | User Management</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            color: #111827;
        }

        .main-card {
            background: #ffffff; border: none; border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
        }

        /* Table Styling */
        .table-custom { border-collapse: separate; border-spacing: 0 10px; }
        .table-custom tr { background: #f9fafb; transition: 0.2s; }
        .table-custom tr:hover { background: #f3f4f6; }
        .table-custom td, .table-custom th { padding: 16px; border: none; }
        .table-custom td:first-child { border-radius: 12px 0 0 12px; }
        .table-custom td:last-child { border-radius: 0 12px 12px 0; }

        /* Button & Badge Styling */
        .btn-back { font-weight: 600; color: #4b5563; text-decoration: none; transition: 0.2s; }
        .btn-back:hover { color: #6366f1; }

        .badge-active { background: #dcfce7; color: #166534; font-weight: 600; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; }
        .badge-blocked { background: #fee2e2; color: #991b1b; font-weight: 600; padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; }

        .btn-action-block { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .btn-action-unblock { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .btn-action-block:hover, .btn-action-unblock:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container py-5">

    <!-- ১. ব্যাক বাটন -->
    <div class="mb-4">
        <a th:href="@{/}" class="btn-back">
            <i class="bi bi-arrow-left-circle-fill me-2"></i>Back to Dashboard
        </a>
    </div>

    <!-- ২. মেইন প্যানেল কার্ড -->
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold m-0 text-dark">User Management</h2>
                <p class="text-muted m-0 small">Admin controls for all registered accounts</p>
            </div>
            <div class="text-end">
                <span class="badge bg-dark rounded-pill px-3 py-2" th:text="${users.size()} + ' Total Users'"></span>
            </div>
        </div>

        <!-- ভুলবশত নিজেকে ব্লক করতে চাইলে এই এরর মেসেজ দেখাবে -->
        <div th:if="${param.error}" class="alert alert-danger rounded-4 mb-4 small py-2">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Safety Alert: You cannot block your own administrative account!
        </div>

        <!-- ৩. ইউজার টেবিল -->
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr class="text-muted small fw-bold">
                    <th>USER PROFILE</th>
                    <th>LOCATION</th>
                    <th>ROLE</th>
                    <th>STATUS</th>
                    <th class="text-end pe-4">MANAGEMENT</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="bg-light p-2 rounded-circle me-3 text-primary">
                                <i class="bi bi-person-circle fs-4"></i>
                            </div>
                            <div>
                                <div class="fw-bold text-dark" th:text="${u.username}">Username</div>
                                <small class="text-muted" th:text="${u.email}">email@example.com</small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="text-muted" th:text="${u.address.city + ', ' + u.address.country}">City, BD</span>
                    </td>
                    <td>
                        <span class="small fw-bold text-uppercase text-secondary" th:text="${u.role}">ROLE</span>
                    </td>
                    <td>
                        <span th:if="${u.blocked}" class="badge-blocked"><i class="bi bi-slash-circle me-1"></i>Suspended</span>
                        <span th:unless="${u.blocked}" class="badge-active"><i class="bi bi-check-circle me-1"></i>Active</span>
                    </td>
                    <td class="text-end pe-4">

                        <!-- ৪. নিজের একাউন্টের জন্য বাটন হাইড করার লজিক (Self-Block Prevention) -->
                        <div th:if="${u.email == #authentication.name}">
                            <span class="badge bg-light text-dark border px-3 py-2"><i class="bi bi-shield-lock"></i> It's You</span>
                        </div>

                        <!-- অন্য ইউজারদের জন্য ব্লক/আনব্লক বাটন -->
                        <div th:unless="${u.email == #authentication.name}">
                            <a th:href="@{/admin/block/{id}(id=${u.id})}"
                               th:class="${u.blocked ? 'btn btn-sm btn-action-unblock rounded-pill px-4' : 'btn btn-sm btn-action-block rounded-pill px-4'}"
                               th:text="${u.blocked ? 'Restore Account' : 'Block User'}"
                               onclick="return confirm('Are you sure you want to change this user\'s access?')">
                            </a>
                        </div>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${users.isEmpty()}" class="text-center py-5">
            <i class="bi bi-people fs-1 text-muted opacity-25"></i>
            <p class="text-muted mt-2">No other users found in the system.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
