<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .container { margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h3>User Management</h3>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Back to Dashboard</a>
    </div>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <span th:if="${u.blocked}" class="badge bg-danger">Blocked</span>
                <span th:unless="${u.blocked}" class="badge bg-success">Active</span>
            </td>
            <td>
                <!-- এই বাটনটিই ব্লক এবং আনব্লক দুই কাজ করবে -->
                <a th:href="@{/admin/block/{id}(id=${u.id})}"
                   th:class="${u.blocked ? 'btn btn-success btn-sm' : 'btn btn-danger btn-sm'}"
                   th:text="${u.blocked ? 'Unblock User' : 'Block User'}">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
