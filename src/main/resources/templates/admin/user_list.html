<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubScript Pro | User Management</title>
    <!-- Modern Font and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            color: #111827;
        }

        .main-card {
            background: #ffffff; border: none; border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        /* Table Styling */
        .table-custom { border-collapse: separate; border-spacing: 0 10px; }
        .table-custom tr { background: #f9fafb; transition: 0.2s; }
        .table-custom tr:hover { background: #f3f4f6; }
        .table-custom td, .table-custom th { padding: 16px; border: none; }
        .table-custom td:first-child { border-radius: 12px 0 0 12px; }
        .table-custom td:last-child { border-radius: 0 12px 12px 0; }

        /* Button & Badge Styling */
        .btn-back { font-weight: 500; color: #4b5563; text-decoration: none; transition: 0.2s; }
        .btn-back:hover { color: #6366f1; }

        .badge-active { background: #dcfce7; color: #166534; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
        .badge-blocked { background: #fee2e2; color: #991b1b; font-weight: 600; padding: 6px 12px; border-radius: 8px; }

        .btn-action-block { background: #fee2e2; color: #991b1b; border: none; }
        .btn-action-unblock { background: #dcfce7; color: #166534; border: none; }
    </style>
</head>
<body>

<div class="container py-5">

    <!-- ১. ব্যাক বাটন (Back to Dashboard) -->
    <div class="mb-4">
        <a th:href="@{/}" class="btn-back">
            <i class="bi bi-arrow-left-circle-fill me-2"></i>Back to Dashboard
        </a>
    </div>

    <!-- ২. হেডার সেকশন -->
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold m-0">User Management</h2>
                <p class="text-muted m-0">Review and manage all registered accounts.</p>
            </div>
            <div class="text-end">
                <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${users.size()} + ' Total Users'"></span>
            </div>
        </div>

        <!-- ৩. ইউজার টেবিল -->
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr class="text-muted small">
                    <th>USER DETAILS</th>
                    <th>LOCATION</th>
                    <th>ROLE</th>
                    <th>STATUS</th>
                    <th class="text-end">ACTION</th>
                </tr>
                </thead>
                <tbody>
                <!-- Java থেকে আসা 'users' লিস্ট লুপ হচ্ছে -->
                <tr th:each="u : ${users}">
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="bg-light p-2 rounded-circle me-3">
                                <i class="bi bi-person-fill text-secondary"></i>
                            </div>
                            <div>
                                <div class="fw-bold" th:text="${u.username}">Username</div>
                                <small class="text-muted" th:text="${u.email}">email@example.com</small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span th:text="${u.address.city + ', ' + u.address.country}">City, Country</span>
                    </td>
                    <td>
                        <span class="small fw-bold text-uppercase" th:text="${u.role}">ROLE</span>
                    </td>
                    <td>
                        <!-- ব্লক স্ট্যাটাস অনুযায়ী ব্যাজ -->
                        <span th:if="${u.blocked}" class="badge-blocked">Suspended</span>
                        <span th:unless="${u.blocked}" class="badge-active">Active</span>
                    </td>
                    <td class="text-end">
                        <!-- ৪. ব্লক/আনব্লক করার টগল বাটন -->
                        <a th:href="@{/admin/block/{id}(id=${u.id})}"
                           th:class="${u.blocked ? 'btn btn-sm btn-action-unblock rounded-pill px-3' : 'btn btn-sm btn-action-block rounded-pill px-3'}"
                           th:text="${u.blocked ? 'Unblock User' : 'Block User'}">
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- যদি কোনো ইউজার না থাকে -->
        <div th:if="${users.isEmpty()}" class="text-center py-5">
            <i class="bi bi-people fs-1 text-muted"></i>
            <p class="text-muted mt-2">No users registered in the system yet.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
