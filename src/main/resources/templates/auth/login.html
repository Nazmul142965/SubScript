<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubScript Pro | Login</title>
    <!-- Modern Font and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
        }
        .btn-primary {
            background-color: #6366f1;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
        }
        .form-control { border-radius: 10px; padding: 12px; }

        /* Quick Login Box Styling */
        .quick-login-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 16px;
        }
        .login-option {
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .login-option:hover { background-color: #eff6ff; border: 1px solid #6366f1; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="fw-bold">SubScript <span class="text-primary">Pro</span></h3>
        <p class="text-muted small">Sign in to manage your bills</p>
    </div>

    <!-- রেজিস্ট্রেশন সাকসেস মেসেজ -->
    <div th:if="${param.success}" class="alert alert-success text-center py-2 mb-3 small">
        Registration Successful! Please login.
    </div>

    <!-- লগইন এরর মেসেজ -->
    <div th:if="${param.error}" class="alert alert-danger text-center py-2 mb-3 small">
        <span th:if="${session.SPRING_SECURITY_LAST_EXCEPTION != null}"
              th:text="${session.SPRING_SECURITY_LAST_EXCEPTION.message}">
              Invalid Username or Password
        </span>
        <span th:unless="${session.SPRING_SECURITY_LAST_EXCEPTION != null}">
              Invalid Username or Password
        </span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Email Address</label>
            <!-- ID দেওয়া হয়েছে যাতে অটো-ফিল কাজ করে -->
            <input type="email" id="emailField" name="username" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary">Password</label>
            <!-- ID দেওয়া হয়েছে যাতে অটো-ফিল কাজ করে -->
            <input type="password" id="passField" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">Sign In</button>
    </form>

    <!-- অটো-ফিল বাটন সেকশন -->
    <div class="quick-login-box">
        <h6 class="fw-bold text-muted small mb-3"><i class="bi bi-magic me-2"></i>Quick Login (Click to fill)</h6>

        <!-- এডমিন ক্রেডেনশিয়াল -->
        <div class="login-option mb-2" onclick="fillLogin('admin@gmail.com', 'admin123')">
            <div class="small">
                <span class="badge bg-dark">ADMIN</span>
                <span class="text-secondary ms-1">admin@gmail.com</span>
            </div>
            <i class="bi bi-arrow-right-short text-primary fs-4"></i>
        </div>

        <!-- ইউজার ক্রেডেনশিয়াল -->
        <div class="login-option" onclick="fillLogin('nazmul@gmail.com', 'nazmul123')">
            <div class="small">
                <span class="badge bg-secondary">USER</span>
                <span class="text-secondary ms-1">nazmul@gmail.com</span>
            </div>
            <i class="bi bi-arrow-right-short text-secondary fs-4"></i>
        </div>
    </div>

    <div class="text-center mt-4">
        <p class="small text-muted">Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Register</a></p>
    </div>
</div>

<!-- বাটন ক্লিক করলে বক্স ফিলাপ হওয়ার লজিক -->
<script>
    function fillLogin(email, pass) {
        document.getElementById('emailField').value = email;
        document.getElementById('passField').value = pass;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
