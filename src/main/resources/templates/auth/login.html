<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubScript | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .btn-primary { background-color: #6366f1; border: none; border-radius: 12px; padding: 12px; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="fw-bold text-center mb-4">Welcome Back</h3>

    <!-- Spring Security ডিফল্টভাবে /login এ ডাটা চেক করে -->
    <form th:action="@{/login}" method="post">

        <!-- এরর মেসেজ দেখানোর জন্য (যদি পাসওয়ার্ড ভুল হয়) -->
        <div th:if="${param.error}" class="alert alert-danger text-center small">
            Invalid username or password.
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold">Email Address</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-4">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
    </form>

    <div class="mt-4 text-center">
        <p class="small text-muted">Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold">Register</a></p>
    </div>
</div>

</body>
</html>
