<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Subscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .form-card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card form-card p-4">
                <h3 class="fw-bold mb-4 text-center" th:text="${subscription.id == null ? 'Add New' : 'Edit Subscription'}">Manage</h3>

                <form th:action="@{/save}" th:object="${subscription}" method="post">
                    <!-- Hidden ID for Updates -->
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">SERVICE NAME</label>
                        <input type="text" th:field="*{contactName}" class="form-control" required>
                        <p class="text-danger small" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></p>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">COST (৳)</label>
                            <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">CATEGORY</label>
                            <select th:field="*{category}" class="form-select">
                                <option value="Streaming">Streaming</option>
                                <option value="Gaming">Gaming</option>
                                <option value="Work">Work/Cloud</option>
                                <option value="Health">Health/Gym</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">NEXT BILLING DATE</label>
                        <input type="date" th:field="*{billingDate}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">NOTES / MESSAGE</label>
                        <textarea th:field="*{contactMessage}" class="form-control" rows="2" placeholder="Optional notes..."></textarea>
                    </div>

                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch">
                        <label class="form-check-label" for="activeSwitch">Active Subscription</label>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Save Record</button>
                        <a href="/" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
