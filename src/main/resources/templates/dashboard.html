<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubScript Pro | Dashboard</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary-color: #6366f1; --bg-color: #f8fafc; }
        body { background-color: var(--bg-color); font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; }

        /* Modern Cards */
        .glass-card {
            background: white; border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px; shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .stat-card { border-left: 5px solid var(--primary-color); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* Custom Table */
        .table thead th { background: #f1f5f9; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; color: #64748b; border: none; }
        .table tbody tr { border-bottom: 1px solid #f1f5f9; vertical-align: middle; }

        /* Status Badges */
        .badge-active { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .badge-paused { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        /* Sidebar Simulation */
        .nav-link-custom { color: #64748b; font-weight: 600; padding: 10px 20px; border-radius: 12px; transition: 0.2s; }
        .nav-link-custom:hover { background: #eef2ff; color: var(--primary-color); }
        .active-link { background: var(--primary-color) !important; color: white !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-md-2 bg-white min-vh-100 border-end d-none d-md-block p-4">
            <h4 class="fw-bold text-primary mb-5"><i class="bi bi-wallet2 me-2"></i>SubScript</h4>
            <div class="nav flex-column gap-2">
                <a href="/" class="nav-link-custom active-link"><i class="bi bi-grid-1x2-fill me-2"></i> Dashboard</a>
                <a href="/timeline" class="nav-link-custom"><i class="bi bi-calendar3 me-2"></i> Timeline</a>
                <a href="/add" class="nav-link-custom"><i class="bi bi-plus-circle me-2"></i> New Entry</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-lg-5 p-3">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold m-0">Financial Overview</h2>
                    <p class="text-muted">Welcome back, Nazmul!</p>
                </div>
                <a href="/add" class="btn btn-primary btn-lg rounded-4 px-4 shadow-sm">
                    <i class="bi bi-plus-lg me-2"></i>Add Subscription
                </a>
            </div>

            <!-- Stats Row -->
            <div class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="glass-card stat-card p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="bg-primary bg-opacity-10 p-2 rounded-3 text-primary"><i class="bi bi-cash-stack h4"></i></div>
                        </div>
                        <small class="text-muted fw-bold">TOTAL MONTHLY BURN</small>
                        <h2 class="fw-bold" th:text="${#numbers.formatDecimal(totalMonthly, 1, 2)} + ' ৳'">0.00 ৳</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-4 border-start border-5 border-success">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="bg-success bg-opacity-10 p-2 rounded-3 text-success"><i class="bi bi-check2-circle h4"></i></div>
                        </div>
                        <small class="text-muted fw-bold">ACTIVE SERVICES</small>
                        <h2 class="fw-bold" th:text="${activeCount}">0</h2>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-4 border-start border-5 border-dark">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="bg-dark bg-opacity-10 p-2 rounded-3 text-dark"><i class="bi bi-star h4"></i></div>
                        </div>
                        <small class="text-muted fw-bold">PREMIUM SERVICE</small>
                        <h2 class="h4 fw-bold mt-1" th:text="${mostExpensive}">None</h2>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Visual Analytics -->
                <div class="col-lg-5">
                    <div class="glass-card p-4 h-100">
                        <h5 class="fw-bold mb-4">Spending by Category</h5>
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>

                <!-- Recent Subscriptions -->
                <div class="col-lg-7">
                    <div class="glass-card overflow-hidden">
                        <div class="p-4 border-bottom">
                            <h5 class="fw-bold m-0">Subscription Records</h5>
                        </div>
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th class="ps-4">Service</th>
                                <th>Monthly Cost</th>
                                <th>Status</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="sub : ${subscriptions}">
                                <td class="ps-4 py-3">
                                    <div class="d-flex align-items-center">
                                        <div class="bg-light p-2 rounded-3 me-3 text-primary"><i class="bi bi-lightning-charge"></i></div>
                                        <div>
                                            <div class="fw-bold" th:text="${sub.contactName}">Netflix</div>
                                            <small class="text-muted" th:text="${sub.category}">Category</small>
                                        </div>
                                    </div>
                                </td>
                                <td class="fw-bold" th:text="${sub.amount} + ' ৳'">0 ৳</td>
                                <td>
                                    <span th:if="${sub.active}" class="badge badge-active rounded-pill px-3">Active</span>
                                    <span th:unless="${sub.active}" class="badge badge-paused rounded-pill px-3">Paused</span>
                                </td>
                                <td class="text-end pe-4">
                                    <a th:href="@{/edit/{id}(id=${sub.id})}" class="btn btn-sm btn-light rounded-3 me-1"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/delete/{id}(id=${sub.id})}" class="btn btn-sm btn-light text-danger rounded-3" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const ctx = document.getElementById('categoryChart').getContext('2d');
    const categoryData = /*[[${categoryTotals}]]*/ {};

    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(categoryData),
            datasets: [{
                data: Object.values(categoryData),
                backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                hoverOffset: 15,
                borderWidth: 5,
                borderColor: '#ffffff'
            }]
        },
        options: {
            cutout: '75%',
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } }
            }
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
