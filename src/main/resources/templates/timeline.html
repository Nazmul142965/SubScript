<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SubScript | Timeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; }
        .timeline-item { border-left: 3px solid #0d6efd; position: relative; padding-left: 25px; margin-bottom: 25px; }
        .marker { width: 12px; height: 12px; border-radius: 50%; background: #0d6efd; position: absolute; left: -7.5px; top: 10px; }
    </style>
</head>
<body>

<div class="container py-5">
    <a href="/" class="btn btn-sm btn-light border mb-4">← Dashboard</a>
    <h2 class="fw-bold mb-5">Upcoming Renewal Timeline</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Java থেকে পাঠানো subscriptionsSorted লিস্টটি এখানে লুপ হবে -->
            <div th:each="sub : ${subscriptionsSorted}" class="timeline-item">
                <div class="marker"></div>
                <div class="card p-3 shadow-sm border-0 bg-light">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h5 th:text="${sub.contactName}" class="m-0 fw-bold">Service Name</h5>

                            <small th:text="${#temporals.format(sub.billingDate, 'dd MMM yyyy')}" class="text-muted"></small>
                        </div>
                        <div class="text-end">
                            <h4 th:text="'- ' + ${sub.amount} + ' ৳'" class="text-danger m-0 fw-bold"></h4>
                            <span class="badge bg-primary" th:text="${sub.category}">Category</span>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${subscriptionsSorted.isEmpty()}" class="text-center py-5">
                <div class="card card-body border-0 shadow-sm bg-light">
                    <p class="text-muted m-0">No upcoming renewals found. Add some subscriptions to see your timeline!</p>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
